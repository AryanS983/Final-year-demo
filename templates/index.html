{% extends 'base.html' %}
{% block title %}Home - Mutual Fund Risk Matrix{% endblock %}
{% block content %}
<section class="hero">
  <div class="glass-card">
    <h1>Mutual Fund Risk Analyzer</h1>
    <p style="color: rgba(255,255,255,0.8); margin-bottom: 2rem; font-size: 1.1rem;">
      Analyze mutual fund performance with advanced risk metrics and beautiful visualizations
    </p>
    <form action="/dashboard" method="post" class="input-form">
      <input id="fund-search" name="scheme_code" placeholder="Type fund name or code" autocomplete="off">
      <ul id="suggestions" class="suggestions"></ul>
      <input type="date" name="start_date" required>
      <input type="date" name="end_date" required>
      <button type="submit">Analyze Fund</button>
    </form>
  </div>
</section>
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endblock %}
